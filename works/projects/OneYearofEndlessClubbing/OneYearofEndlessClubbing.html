<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">

<link rel="stylesheet" href="../pages.css">

</head>

<body>

<a class="home-logo" href="/" aria-label="Home"><img src="/img/monogram.png" alt="" width="36" height="36"></a>
<nav class="navbar">
    <a href="/work.html">Work</a>
</nav>

<section class="slider">
    <div class="slides">
        <img src="1.jpg" >
        <img src="2.jpg" >
        <img src="3.jpg" >
        <img src="4.gif" >
    </div>
</section>

<section class="text-wrapper">
    <div class="project-title">One Year of Endless Clubbing | The Old Factory</div>
    <div class="project-meta">Berlin, 2025</div>
<p>GrandMA2 lighting programming, design, and live operation for a multi-stage event at <a target="_blank" class="inline-link" href="https://www.instagram.com/club8ing/">Club8</a>, Berlin. Delivered real-time lighting control.</p>

</section>

<script>
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});
// ---------------------- PC 휠 슬라이드 ----------------------
const slides = document.querySelectorAll('.slides');

slides.forEach(slider => {
    const slideImages = slider.querySelectorAll('img');
    let currentIndex = 0;
    const maxIndex = slideImages.length - 1;

    if(window.innerWidth > 768){
        window.addEventListener('wheel', e => {
            if (!slider.contains(e.target)) return;

            const delta = e.deltaY;

            if ((delta > 0 && currentIndex < maxIndex) || (delta < 0 && currentIndex > 0)) {
                e.preventDefault();
                currentIndex = delta > 0
                    ? Math.min(currentIndex + 1, maxIndex)
                    : Math.max(currentIndex - 1, 0);
                slider.style.transform = `translateX(-${currentIndex * 100}%)`;
            }

            if ((currentIndex === maxIndex && delta > 0) || (currentIndex === 0 && delta < 0)) {
                document.body.style.overflowY = 'auto';
            } else {
                document.body.style.overflowY = 'hidden';
            }
        });
    }
});

// ---------------------- 모바일 슬라이드 + 세로스크롤 제어 ----------------------
if(window.innerWidth <= 768){
    slides.forEach(slider => {
        function updateVerticalScrollLock() {
            const atStart = slider.scrollLeft <= 2;
            const atEnd = slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 2;

            if (atStart || atEnd) {
                document.body.style.overflowY = 'auto';
            } else {
                document.body.style.overflowY = 'hidden';
            }
        }

        slider.addEventListener('scroll', updateVerticalScrollLock);
        updateVerticalScrollLock();
    });
}

if (window.location.pathname === "/works/projects/OneYearofEndlessClubbing/OneYearofEndlessClubbing.html") {
  window.history.replaceState({}, "", "/works/oneyearofendlessclubbing");
}

</script>

</body>
</html>
